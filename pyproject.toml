[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydrascan"
version = "0.1.4"
description = "Graph-native supply-chain blast-radius analysis, powered by HydraDB."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bsh54" }]
keywords = ["security", "supply-chain", "npm", "dependency-graph", "hydradb"]

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt[crypto]>=2.8",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
hydrascan = "hydrascan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrascan"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
